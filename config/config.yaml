# ==============================================================================
# Precision Musumali Gold (XAUUSD) Trading Bot Configuration
# Micro-Account Edition ($10 - $25 Balance Shield)
# ==============================================================================

symbols:
  candidates:
    - "XAUUSDm"    # Exness Standard account suffix
    - "XAUUSD"
    - "XAUUSD_i"   # Exness Raw/Zero account suffix
    - "XAUUSDz"
    - "GOLD"

# ==============================================================================
# ENGINE 1: Musumali Liquidity Sweeps (M15, M30, H1, H4) [Magic: 2001]
# ==============================================================================
musumali_strategy:
  enabled: true
  signal_only_mode: false          # Live Order Execution enabled
  magic_number: 2001               # Fix 10: Unique Magic Number for Musumali_Sweep
  timeframes: ["M15", "M30", "H1", "H4"] # Multi-timeframe institutional sweep scanner
  cluster_search_bars: 15
  min_rejection_wick_pct: 0.15     # 15% wick rejection
  risk_reward_ratio: 2.0           # 1:2 Risk to Reward Target
  
  # Fix 21: ATR-Scaled Dynamic Stop Loss (1.5x ATR)
  atr_period: 14                   # 14-period ATR on execution timeframe
  atr_sl_multiplier: 1.5           # 1.5x ATR stop-loss distance
  min_sl_distance_dollars: 2.00    # Floor to prevent micro-spread compression
  max_sl_distance_dollars: 15.00   # Volatility ceiling

  # Higher-Timeframe Bias
  htf_timeframe: "H1"
  require_htf_alignment: true
  htf_fast_ema: 20
  htf_slow_ema: 50
  htf_trend_ema: 200

# ==============================================================================
# LIQUIDITY ZONE COOLDOWN
# ==============================================================================
zone_management:
  zone_band_points: 5.0
  max_zone_failures: 2
  zone_cooldown_minutes: 10

# ==============================================================================
# ENGINE 2: 1-MINUTE & 5-MINUTE MICRO-SCALPER [Magic: 1001]
# ==============================================================================
m1_scalper:
  enabled: true
  bidirectional: true              # Take both BUY and SELL micro-pullback breakouts
  require_daily_trend_alignment: false # Decoupled from macro Daily gate
  trend_filter_enabled: true       # Strict M15 trend filter
  trend_timeframe: "M15"           # Check M15 EMA20 trend context
  trend_ema_period: 20
  trend_slope_bars: 3
  magic_number: 1001               # Fix 10: Unique Magic Number for M1_Scalp
  timeframes: ["M1", "M5"]         # High-frequency M1 & M5 scalping
  max_concurrent_scalp: 2          # Up to 2 scalper positions
  fast_ema: 7
  slow_ema: 16
  sweep_lookback_bars: 8
  
  # Strict 5-Point Confirmation & ATR-Scaled Risk
  atr_period: 14                   # 14-period ATR on M1
  atr_sl_multiplier: 1.5           # 1.5x ATR stop-loss distance
  risk_reward_ratio: 2.0           # 1:2 R:R target (3.0x ATR take-profit)
  min_sl_dollars: 1.20             # Floor to cover Gold spread noise
  max_loss_dollars: 2.20           # Scalp risk ceiling ($2.20 max)

# ==============================================================================
# DYNAMIC PROFIT MANAGEMENT & RETRACEMENT PROTECTION (UNIFIED)
# ==============================================================================
profit_management:
  # Tier 0: Hard Emergency Loss Shield
  max_hard_loss_per_trade_dollars: 2.50 # Dynamic SL handles risk; hard shield cuts at -$2.50
  max_account_floating_drawdown_dollars: 3.50 # Account-Wide Circuit Breaker: Auto-cuts if total floating loss hits -$3.50
  
  # Tier 1: Early Zero-Loss Profit Lock starting from $0.30 and above
  lock_profit_start_dollars: 0.30      # Lock in profits starting from $0.30 (covers spread + profit)
  breakeven_lock_offset: 0.15          # Lock +$0.15 guaranteed green profit
  
  # Tier 2: Positive Profit Retracement Guard (Never let winning trades turn into losses)
  retrace_guard_min_peak_dollars: 0.30 # Active as soon as trade touches $0.30 peak
  retrace_guard_max_giveback_pct: 0.40 # Close if profit drops 40% from peak
  
  # Tier 3: Rollback Protection starting from $0.75 and above
  rollback_close_trigger_dollars: 0.75 # Active when trade reaches $0.75 or higher
  rollback_retrace_tolerance_dollars: 0.20 # Max allowable dollar reduction from peak
  rollback_giveback_max_pct: 0.25      # Max 25% reduction from peak before checking continuation
  
  # Tier 4: Dynamic Continuous Trailing Stop from +0.6R
  trailing_enabled: true
  trailing_trigger_r: 0.6              # Start continuous trailing early at +0.6R
  trailing_distance_dollars: 0.60      # Tight Gold trailing buffer ($0.60)

# ==============================================================================
# HARMONY & RISK ALLOCATION SPLIT (FIX 11 & FIX 12)
# ==============================================================================
harmony_rules:
  prevent_opposing_trades: false   # Fix 11: Net exposure logging active, optional hard block
  max_opposing_lot_exposure: 0.05  # Fix 11: Cap max opposing lot exposure
  total_max_open_positions: 3      # High-performance limit (up to 3 confirmed trades)
  max_musumali_positions: 2        # Max 2 Musumali trades
  max_scalper_positions: 2         # Max 2 Scalper trades
  cooldown_seconds_per_trade: 0    # Fix 5: Continuous 24/5 candle scanning

risk_management:
  lot_mode: "fixed"                # Fixed micro lots for safety
  risk_per_trade_percent: 1.5      # Base 1.5% risk per trade
  max_total_account_risk_percent: 6.0 # Total portfolio shared risk ceiling
  fixed_lot_size: 0.01             # Base micro lot
  max_daily_trades: 50
  max_spread_points: 350
  slippage_points: 25

# ==============================================================================
# CIRCUIT BREAKERS (FIX 17)
# ==============================================================================
circuit_breakers:
  max_daily_drawdown_percent: 50.0 # Halt if daily loss exceeds 50% ($5.00 on $10 account)
  max_daily_profit_percent: 100.0  # Daily target 100%
  max_consecutive_losses: 3        # Fix 17: Pause module after 3 consecutive losses
  consecutive_loss_window_minutes: 30 # Fix 17: Window to detect clustered losses
  circuit_breaker_cooldown_minutes: 20 # Fix 17: Cooldown duration before re-enabling entries

system:
  poll_interval_seconds: 1
  heartbeat_interval_seconds: 60
  log_level: "INFO"
