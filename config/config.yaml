# ==============================================================================
# Precision Multi-Account & Multi-Symbol Trading Bot Configuration
# Dual-Engine: Musumali Sweeps (2001) & Agile Micro-Scalper (1001)
# 
# EXACT ACCOUNT STRUCTURE (4 ACCOUNTS):
#   - ACCOUNT A: $1,000 BrightFunded (User's Account) -> INDEPENDENT (Zero Copy)
#   - ACCOUNT B: $1,000 BrightFunded (Brother's Account) -> INDEPENDENT (Zero Copy)
#   - ACCOUNT C: $20 Personal Account -> COPY MASTER
#   - ACCOUNT D: $20 Personal Account -> COPY FOLLOWER (C -> D Only)
# ==============================================================================

# ==============================================================================
# 1. BRIGHTFUNDED $1,000 ACCOUNTS PROFILE (Accounts A & B)
# ==============================================================================
funded_account:
  enabled: true
  initial_account_size_dollars: 1000.0
  mode_name: "BRIGHTFUNDED_FREE_1K_CHALLENGE"
  
  # BrightFunded Official Firm Limits
  firm_daily_drawdown_limit_dollars: 30.0    # 3% = $30.00 hard limit
  firm_trailing_max_drawdown_dollars: 60.0   # 6% = $60.00 dynamic trailing max drawdown
  challenge_target_profit_dollars: 100.0     # Target: +$100.00 (Account Goal: $1,100.00)

  # Internal Multi-Tier Daily Drawdown Safety Protection (Leaving buffer below $30 limit)
  internal_daily_warning_dollars: 15.0       # -$15.00: Warning threshold
  internal_daily_reduced_risk_dollars: 20.0  # -$20.00: Reduced-risk mode
  internal_daily_hard_stop_dollars: 25.0     # -$25.00: Hard Stop (Leaves ~$5 safety buffer below $30 limit)

  # Internal Dynamic Trailing Maximum Drawdown Safety Protection (HWM - Equity)
  internal_trailing_warning_dollars: 30.0    # Drawdown $30 from HWM: Caution mode
  internal_trailing_reduced_risk_dollars: 40.0 # Drawdown $40 from HWM: Cut risk to 0.4x
  internal_trailing_hard_stop_dollars: 50.0  # Drawdown $50 from HWM: Hard stop (Leaves $10 buffer below $60)

  # Individual Trade Risk Bounds ($2.50 to $5.00 max)
  max_single_trade_risk_dollars: 5.00        # Normal maximum risk per trade (~$5.00)
  preferred_risk_min_dollars: 2.50           # Preferred risk floor ($2.50)
  preferred_risk_max_dollars: 5.00           # Preferred risk ceiling ($5.00)
  single_trade_hard_reject_dollars: 5.50     # Strict rejection ceiling

  # Profit Management & Daily Objectives ($30 -> $40 -> $50 Lifecycle)
  daily_profit_objective_min: 30.0           # +$30.00: Activate profit protection
  daily_profit_objective_selective: 40.0     # +$40.00: High selectivity mode (Score >= 80)
  daily_profit_objective_max: 50.0           # +$50.00: Stop opening unnecessary new trades

# ==============================================================================
# 2. PERSONAL $20 ACCOUNTS PROFILE (Accounts C & D)
# ==============================================================================
personal_account:
  initial_account_size_dollars: 20.0
  max_single_trade_risk_dollars: 0.60        # Normal maximum risk per trade ($0.60 = 2.0%)
  preferred_risk_min_dollars: 0.30           # Floor ($0.30)
  preferred_risk_max_dollars: 0.60           # Ceiling ($0.60)
  single_trade_hard_reject_dollars: 0.90     # Strict rejection if 0.01 lot loss exceeds $0.90
  daily_drawdown_limit_dollars: 2.50         # Daily hard stop at -$2.50 (Never blows $20 account)
  daily_profit_objective_dollars: 3.00       # Target: +$3.00

# ==============================================================================
# 3. EXACT 4-ACCOUNT CONFIGURATION & ROUTING
# ==============================================================================
accounts:
  enabled: true
  multi_account_mode: true
  account_list:
    # ACCOUNT A: $1,000 BrightFunded - User's Account (Independent, Shared Strategy, No Copy)
    - id: "account_a"
      name: "BrightFunded Account A (My Account)"
      type: "BRIGHTFUNDED"
      balance: 1000.0
      mode: "INDEPENDENT"
      copy_enabled: false
      env_login_var: "ACCOUNT_A_LOGIN"
      env_password_var: "ACCOUNT_A_PASSWORD"
      env_server_var: "ACCOUNT_A_SERVER"
      env_path_var: "ACCOUNT_A_MT5_PATH"
      fallback_login_var: "ACCOUNT_1_LOGIN"
      fallback_password_var: "ACCOUNT_1_PASSWORD"
      fallback_server_var: "ACCOUNT_1_SERVER"
      is_active: true

    # ACCOUNT B: $1,000 BrightFunded - Brother's Account (Independent, Shared Strategy, No Copy)
    - id: "account_b"
      name: "BrightFunded Account B (Brother's Account)"
      type: "BRIGHTFUNDED"
      balance: 1000.0
      mode: "INDEPENDENT"
      copy_enabled: false
      env_login_var: "ACCOUNT_B_LOGIN"
      env_password_var: "ACCOUNT_B_PASSWORD"
      env_server_var: "ACCOUNT_B_SERVER"
      env_path_var: "ACCOUNT_B_MT5_PATH"
      fallback_login_var: "ACCOUNT_2_LOGIN"
      fallback_password_var: "ACCOUNT_2_PASSWORD"
      fallback_server_var: "ACCOUNT_2_SERVER"
      is_active: true

    # ACCOUNT C: $20 Personal Account - Copy Master (Shared Strategy, Generates Copy Events for D)
    - id: "account_c"
      name: "Personal Account C ($20 Master)"
      type: "PERSONAL"
      balance: 30.0
      mode: "COPY_MASTER"
      copy_enabled: true
      env_login_var: "ACCOUNT_C_LOGIN"
      env_password_var: "ACCOUNT_C_PASSWORD"
      env_server_var: "ACCOUNT_C_SERVER"
      env_path_var: "ACCOUNT_C_MT5_PATH"
      fallback_login_var: "ACCOUNT_3_LOGIN"
      fallback_password_var: "ACCOUNT_3_PASSWORD"
      fallback_server_var: "ACCOUNT_3_SERVER"
      is_active: true

    # ACCOUNT D: $20 Personal Account - Copy Follower (Copies ONLY Account C after 8-step safety check)
    - id: "account_d"
      name: "Personal Account D ($20 Follower)"
      type: "PERSONAL"
      balance: 30.0
      mode: "COPY_FOLLOWER"
      copy_source: "account_c"
      copy_enabled: true
      env_login_var: "ACCOUNT_D_LOGIN"
      env_password_var: "ACCOUNT_D_PASSWORD"
      env_server_var: "ACCOUNT_D_SERVER"
      env_path_var: "ACCOUNT_D_MT5_PATH"
      fallback_login_var: "ACCOUNT_4_LOGIN"
      fallback_password_var: "ACCOUNT_4_PASSWORD"
      fallback_server_var: "ACCOUNT_4_SERVER"
      is_active: true

# ==============================================================================
# 4. ISOLATED COPY TRADING ENGINE (Strictly Account C -> Account D)
# ==============================================================================
copy_engine:
  enabled: true
  master_account_id: "account_c"
  follower_account_id: "account_d"
  max_follower_risk_dollars: 0.50      # Sizing & risk ceiling on follower ($0.50)
  hard_reject_risk_dollars: 1.00       # Reject copy if min volume loss exceeds $1.00
  max_spread_points_gold: 320
  max_spread_points_btc: 2500
  slippage_points: 30
  sync_sl_tp_modifications: true       # Mirror SL and TP adjustments
  sync_partial_closes: true            # Mirror partial closes
  sync_full_closes: true               # Mirror position exits
  auto_reopen_on_master_open: false    # Strictly FALSE: Never reopen if follower closed on own risk

# ==============================================================================
# 5. TRADING SYMBOLS CONFIGURATION (XAUUSD and BTCUSD)
# ==============================================================================
symbols:
  active_symbols: ["XAUUSD"]
  symbol_settings:
    XAUUSD:
      candidates: ["XAU/USD", "XAUUSDm", "XAUUSD", "XAUUSD_i", "XAUUSDz", "GOLD"]
      asset_type: "COMMODITY_GOLD"
      max_spread_points: 320
      atr_period: 14
      min_sl_distance_dollars: 0.40
      max_sl_distance_dollars: 3.50
      zone_band_points: 2.0
      risk_multiplier: 1.0
      scalp_min_sl_dollars: 0.40
      scalp_max_sl_dollars: 2.80
    BTCUSD:
      candidates: ["BTC/USD", "BTCUSDm", "BTCUSD", "BTCUSD_i", "BTCUSDz", "BITCOIN", "BTC"]
      asset_type: "CRYPTO_BITCOIN"
      max_spread_points: 2500         # Crypto spread tolerance in points
      atr_period: 14
      min_sl_distance_dollars: 150.00 # BTC volatility floor
      max_sl_distance_dollars: 600.00
      zone_band_points: 100.0
      risk_multiplier: 1.0
      scalp_min_sl_dollars: 120.00
      scalp_max_sl_dollars: 350.00

# ==============================================================================
# 6. ENGINE 1: Musumali Institutional Liquidity Sweeps (M30, H1, H4, D1) [Magic: 2001]
# ==============================================================================
musumali_strategy:
  enabled: true
  signal_only_mode: false             # Live Order Execution enabled
  magic_number: 2001                  # Unique Magic Number for Musumali_Sweep
  timeframes: ["M30", "H1", "H4"]     # Primary M30/H1 with H4 context
  cluster_search_bars: 15
  min_rejection_wick_pct: 0.15        # 15% wick rejection
  risk_reward_ratio: 2.5              # 1:2.5 Risk to Reward Target
  atr_period: 14                      # 14-period ATR on execution timeframe
  atr_sl_multiplier: 1.5              # 1.5x ATR stop-loss distance
  
  # Higher-Timeframe Bias
  htf_timeframe: "H1"
  require_htf_alignment: false
  htf_fast_ema: 20
  htf_slow_ema: 50
  htf_trend_ema: 200

# ==============================================================================
# 7. LIQUIDITY ZONE COOLDOWN
# ==============================================================================
zone_management:
  zone_band_points: 2.0
  max_zone_failures: 2
  zone_cooldown_minutes: 10

# ==============================================================================
# 8. ENGINE 2: HIGH-CONVICTION MICRO-SCALPER (M1, M5, M15) [Magic: 1001]
# ==============================================================================
m1_scalper:
  enabled: true
  bidirectional: true                 # Agile Bidirectional entries
  require_daily_trend_alignment: false
  trend_filter_enabled: true          # Reference M15 trend context
  trend_timeframe: "M15"
  trend_ema_period: 20
  trend_slope_bars: 3
  magic_number: 1001                  # Unique Magic Number for M1_Scalp
  timeframes: ["M1", "M5", "M15"]     # Active multi-timeframe micro-scalping
  min_quality_score: 70               # Agile Quality Score Threshold
  max_concurrent_scalp: 1             # Max 1 active scalper position per account
  fast_ema: 7
  slow_ema: 16
  sweep_lookback_bars: 8
  atr_period: 14
  atr_sl_multiplier: 1.5
  risk_reward_ratio: 2.5

# ==============================================================================
# 9. INTELLIGENT POSITION MANAGEMENT & PROFIT RETENTION
# ==============================================================================
profit_management:
  enabled: true
  dollar_step_lock_enabled: true      # Fast Breakeven & 50-Cent Immediate Profit Step Lock
  step_trigger_dollars: 0.50          # Immediate breakeven trigger at +$0.50 profit
  step_size_dollars: 0.50             # Step lock advancing every +$0.50 added in profit
  breakeven_buffer_dollars: 0.05      # Spread/commission positive buffer (+0.05)
  
  # Agile R-Multiple Dynamic Profit-Lock Stages (1R = Initial Monetary Risk)
  breakeven_trigger_r: 0.50           # At +0.50R -> Begin protection (breakeven buffer)
  breakeven_lock_r: 0.10              # Guaranteed green buffer (+0.10R)
  tier1_protect_trigger_r: 1.00       # At +1.00R -> Protect meaningful profit (+0.50R)
  tier1_protect_lock_r: 0.50
  tier2_protect_trigger_r: 1.50       # At +1.50R -> Allow strong winners to run (+1.00R locked)
  tier2_protect_lock_r: 1.00
  tier3_protect_trigger_r: 2.00       # At +2.00R -> Volatility-Aware Intelligent Trailing
  tier3_protect_lock_r: 1.50
  tier4_protect_trigger_r: 3.00       # At +3.00R+ -> Structure-based runner trailing
  tier4_protect_lock_r: 2.30
  
  # Multi-Signal Confirmed Reversal & Maturation Thresholds
  reversal_exit_threshold: 80         # Strict multi-signal agreement required (Score >= 80)
  reversal_warning_threshold: 60      # Reversal Score 60-79 -> Monitor closely
  min_bars_before_reversal: 3         # Trade must mature at least 3 bars before early reversal exit
  min_seconds_before_reversal: 120    # Minimum 120s duration before early reversal exit
  continuation_strong_threshold: 60   # Continuation Score >= 60 -> Let runners breathe
  
  # Dynamic Volatility-Aware Giveback & Peak R Decay (Only for Realized >= +1.0R Moves)
  giveback_min_peak_r: 1.00           # Giveback protection activates only once trade touches >= +1.00R peak
  giveback_max_r_decay: 0.40          # Bank profit if trade rolls back >0.40R from peak (locks >= +0.60R)
  
  # Stale Trade Failure Timeout (Bars Held without progress)
  scalp_timeout_bars: 15              # Close stagnating M1 micro-scalps after 15 bars
  musumali_timeout_bars: 25           # Musumali HTF timeout (25 bars)
  
  # Dynamic Continuous Trailing Stop
  trailing_enabled: true
  trailing_trigger_r: 1.50            # Continuous ATR trailing begins at +1.50R
  trailing_distance_r: 0.60           # 0.60R trailing distance buffer

# ==============================================================================
# 10. HARMONY & CONCURRENCY LIMITS (PER ACCOUNT)
# ==============================================================================
harmony_rules:
  prevent_opposing_trades: true       # Prevent hedging on same symbol
  max_opposing_lot_exposure: 0.0      # Zero opposing lot exposure allowed
  total_max_open_positions: 2         # Max 2 total open positions per account
  max_musumali_positions: 1           # Max 1 Musumali trade per account
  max_scalper_positions: 1            # Max 1 Scalper trade per account
  max_positions_per_symbol: 1         # Max 1 open position per symbol per account
  cooldown_seconds_per_trade: 90      # 90-second agile spacing between trades

# ==============================================================================
# 11. RISK MANAGEMENT & SIZING ENGINE (SHARED LOGIC, ISOLATED STATE)
# ==============================================================================
risk_management:
  lot_mode: "dynamic_risk"            # STRICTLY DYNAMIC: Never fixed lots
  risk_per_trade_percent: 0.25        # Base 0.25% ($2.50 per trade on $1,000)
  max_daily_trades: 35                # Active daily trade cap allowing multiple sessions
  max_consecutive_losses: 3           # Max 3 consecutive losses before cooldown
  loss_cooldown_minutes: 15           # 15-minute cooldown on 3 losses
  
  # Module Consecutive Loss Multi-Tier Rules
  consecutive_losses:
    caution_threshold: 2              # 2 losses -> state CAUTION
    reduce_risk_threshold: 2          # 2 losses -> 50% risk reduction
    restrict_trading_threshold: 3     # 3 losses -> state RESTRICTED
    pause_module_threshold: 3         # 3 losses -> pause module for cooldown
    module_cooldown_minutes: 30       # 30-minute cooling window

  # High-Impact Macro News Filter
  news_blackout_enabled: true
  blackout_before_minutes: 10
  blackout_after_minutes: 15
  
  # Session Filter & Dynamic Tuning
  session_filter_enabled: true
  allowed_sessions: ["London", "London/NY Overlap", "New York", "Asian", "Late Asian/Off-Hours"]
  session_tuning:
    enabled: true
    sessions:
      "London/NY Overlap":
        quality_score_threshold: 68
        max_spread_points_xau: 320
        max_spread_points_btc: 2500
      "London":
        quality_score_threshold: 68
        max_spread_points_xau: 320
        max_spread_points_btc: 2500
      "New York":
        quality_score_threshold: 68
        max_spread_points_xau: 320
        max_spread_points_btc: 2500
      "Asian":
        quality_score_threshold: 70
        max_spread_points_xau: 280
        max_spread_points_btc: 2200
      "Late Asian/Off-Hours":
        quality_score_threshold: 70
        max_spread_points_xau: 280
        max_spread_points_btc: 2200

# ==============================================================================
# 12. BRIGHTFUNDED CIRCUIT BREAKERS & DRAWDOWN BUFFERS
# ==============================================================================
circuit_breakers:
  # Daily Loss States ($1,000 Baseline | $30 Firm Limit)
  daily_loss_states:
    normal_max_loss_dollars: 15.0       # $0 to -$15: NORMAL ($3.50-$5.00 risk)
    warning_max_loss_dollars: 20.0      # -$15 to -$20: WARNING / CAUTION ($2.50-$3.50 risk)
    reduced_risk_max_loss_dollars: 24.5 # -$20 to -$24.50: REDUCED_RISK (0.4x sizing, min score 75)
    hard_stop_loss_dollars: 25.0        # -$25.00: HARD STOP (Leaves ~$5 buffer below $30 limit)
  
  # Dynamic Trailing Drawdown States (From Lifetime High-Water Mark | $60 Firm Limit)
  trailing_drawdown_states:
    warning_drawdown_dollars: 30.0      # HWM - Equity >= $30: WARNING ($2.50-$3.50 risk)
    reduced_risk_drawdown_dollars: 40.0 # HWM - Equity >= $40: REDUCED_RISK (0.4x sizing)
    hard_stop_drawdown_dollars: 50.0    # HWM - Equity >= $50: HARD STOP (Leaves $10 buffer below $60)

  # Daily Profit Target Lifecycle ($30 -> $40 -> $50 Objective)
  daily_profit_states:
    protection_trigger_dollars: 30.0    # +$30: Enter PROFIT PROTECTION MODE (Lock gains)
    high_selectivity_dollars: 40.0      # +$40: Enter HIGH SELECTIVITY MODE (Score >= 80 only)
    daily_target_stop_dollars: 50.0     # +$50: DAILY TARGET REACHED -> STOP OPENING NEW TRADES
  
  # BrightFunded $100 Challenge Completion State
  challenge_state:
    target_profit_dollars: 100.0        # +$100: Challenge Passed! Halt further trading.

  # Daily High-Water Mark Giveback Protection
  high_water_giveback_protection:
    enabled: true
    min_profit_to_arm_dollars: 25.0     # Arm giveback guardian once daily profit reaches +$25
    max_giveback_pct_of_peak: 35.0      # If equity drops >35% from peak daily profit, stop trading
  
  # Daily Reset Time
  daily_reset_utc_hour: 0               # 00:00 UTC Daily Baseline Reset
  daily_reset_utc_minute: 0

# ==============================================================================
# 13. NOTIFICATIONS & REMOTE CONTROL
# ==============================================================================
notifications:
  telegram_enabled: false             # Set true if Telegram Bot alert is configured
  telegram_bot_token: ""              # Set in config/.env or here
  telegram_chat_id: ""                # Set in config/.env or here
  interactive_commands_enabled: true  # Enable /status, /pnl, /stop_a, /stop_b, /stop_c, /stop_d, /stop_copy, /stop_all

# ==============================================================================
# 14. REAL-TIME DASHBOARD
# ==============================================================================
dashboard:
  enabled: true
  export_interval_seconds: 5          # Auto-export JSON data for live HTML dashboard
  output_dir: "dashboard"

# ==============================================================================
# 15. SYSTEM WATCHDOG & LOGGING
# ==============================================================================
system:
  poll_interval_seconds: 2.0
  heartbeat_interval_seconds: 900     # Comprehensive self-reporting heartbeat every 15 mins
  quick_heartbeat_interval_seconds: 60  # Quick 1-minute pulse
  log_level: "INFO"

