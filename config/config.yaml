# ==============================================================================
# Precision Musumali Gold (XAUUSD) Trading Bot Configuration
# Micro-Account Edition ($10 - $25 Balance Shield)
# ==============================================================================

symbols:
  candidates:
    - "XAUUSDm"    # Exness Standard account suffix
    - "XAUUSD"
    - "XAUUSD_i"   # Exness Raw/Zero account suffix
    - "XAUUSDz"
    - "GOLD"

# ==============================================================================
# ENGINE 1: Musumali Liquidity Sweeps (M15, M30, H1, H4) [Magic: 2001]
# ==============================================================================
musumali_strategy:
  enabled: true
  signal_only_mode: false          # Live Order Execution enabled
  magic_number: 2001               # Fix 10: Unique Magic Number for Musumali_Sweep
  timeframes: ["M15", "M30", "H1", "H4"] # Multi-timeframe institutional sweep scanner
  cluster_search_bars: 15
  min_rejection_wick_pct: 0.15     # 15% wick rejection
  risk_reward_ratio: 2.0           # 1:2 Risk to Reward Target
  
  # Fix 21: ATR-Scaled Dynamic Stop Loss (1.5x ATR)
  atr_period: 14                   # 14-period ATR on execution timeframe
  atr_sl_multiplier: 1.5           # 1.5x ATR stop-loss distance
  min_sl_distance_dollars: 2.00    # Floor to prevent micro-spread compression
  max_sl_distance_dollars: 15.00   # Volatility ceiling

  # Higher-Timeframe Bias
  htf_timeframe: "H1"
  require_htf_alignment: false     # Allow sweeps on both swing highs (sell) and swing lows (buy)
  htf_fast_ema: 20
  htf_slow_ema: 50
  htf_trend_ema: 200

# ==============================================================================
# LIQUIDITY ZONE COOLDOWN
# ==============================================================================
zone_management:
  zone_band_points: 2.0
  max_zone_failures: 2
  zone_cooldown_minutes: 10

# ==============================================================================
# ENGINE 2: HIGH-CONVICTION MICRO-SCALPER (M5, M15) [Magic: 1001]
# ==============================================================================
m1_scalper:
  enabled: true
  bidirectional: false             # Strict Trend Direction: Trade ONLY in the direction of the dominant M15 trend
  require_daily_trend_alignment: false # Decoupled from macro Daily gate
  trend_filter_enabled: true       # Enforce strict M15 trend alignment (SELL in Downtrend, BUY in Uptrend)
  trend_timeframe: "M15"           # Reference M15 trend context
  trend_ema_period: 20
  trend_slope_bars: 3
  magic_number: 1001               # Fix 10: Unique Magic Number for M1_Scalp
  timeframes: ["M5", "M15"]        # Clean M5 & M15 high-probability scalping (Eliminates M1 noise)
  max_concurrent_scalp: 1          # Micro-account: Max 1 active scalper position
  fast_ema: 7
  slow_ema: 16
  sweep_lookback_bars: 8
  
  # Reasonable ATR-Scaled Risk & Stop Loss
  atr_period: 14                   # 14-period ATR on M5
  atr_sl_multiplier: 1.5           # 1.5x ATR stop-loss distance
  risk_reward_ratio: 2.0           # 1:2 R:R target
  min_sl_dollars: 2.00             # Reasonable stop loss floor (giving trade room to breathe)
  max_loss_dollars: 3.00           # Cap max loss to prevent high losses

# ==============================================================================
# DYNAMIC PROFIT MANAGEMENT & RETRACEMENT PROTECTION (UNIFIED)
# ==============================================================================
profit_management:
  # Fix 24: Direct Profit Giveback Cap (40% max giveback once peak hits $0.80+)
  giveback_cap_enabled: true
  giveback_min_peak_dollars: 0.80      # Enforce giveback cap once peak hits $0.80+
  giveback_max_pct: 0.40               # Retain at least 60% of peak gains
  
  # Tier 0: Direct Profit Target Closer ($2.00 - $3.50 Automatic Profit Take)
  auto_take_profit_target_dollars: 2.50 # Direct target take profit ($2.50)
  auto_take_profit_min_dollars: 1.50    # Close if profit reaches $1.50+ and stalls
  
  # Tier 1: Real-World Spread-Safe Breakeven Lock (+0.60+ gain)
  lock_profit_start_dollars: 0.60      # Move SL to breakeven once profit reaches +$0.60 (spread-safe)
  breakeven_lock_offset: 0.25          # Lock +$0.25 guaranteed green profit
  
  # Tier 2: Positive Profit Retracement Guard (NEVER let profitable orders close with a loss)
  retrace_guard_min_peak_dollars: 0.50 # Active once trade touches $0.50 peak
  retrace_guard_max_giveback_pct: 0.35 # Close if profit drops 35% from peak
  
  # Tier 3: Emergency Capital Shield
  max_hard_loss_per_trade_dollars: 2.50 # Cap maximum loss per trade
  max_account_floating_drawdown_dollars: 3.50 # Emergency account-wide shield
  
  # Tier 4: Dynamic Continuous Trailing Stop
  trailing_enabled: true
  trailing_trigger_r: 0.8              # Start continuous trailing at +0.8R
  trailing_distance_dollars: 0.80      # Gold ATR trailing buffer ($0.80)

# ==============================================================================
# HARMONY & RISK ALLOCATION SPLIT (FIX 11 & FIX 12)
# ==============================================================================
harmony_rules:
  prevent_opposing_trades: true    # Fix 11: STRICTLY PREVENT HEDGING (Never BUY and SELL simultaneously)
  max_opposing_lot_exposure: 0.0   # Zero opposing lot exposure allowed
  total_max_open_positions: 2      # Strict concurrency (Max 2 total across account)
  max_musumali_positions: 1        # Max 1 Musumali trade
  max_scalper_positions: 1         # Max 1 Scalper trade
  cooldown_seconds_per_trade: 120  # 2-minute cooldown after trade exit (Prevents churn overtrading)

risk_management:
  lot_mode: "fixed"                # Fixed micro lots for safety
  risk_per_trade_percent: 1.5      # Base 1.5% risk per trade
  max_total_account_risk_percent: 6.0 # Total portfolio shared risk ceiling
  fixed_lot_size: 0.01             # Base micro lot
  max_daily_trades: 15             # Quality over quantity (Max 15 high-conviction trades/day)
  max_spread_points: 350
  slippage_points: 25

# ==============================================================================
# CIRCUIT BREAKERS (FIX 17)
# ==============================================================================
circuit_breakers:
  max_daily_drawdown_percent: 50.0 # Halt if daily loss exceeds 50%
  max_daily_profit_percent: 100.0  # Daily target 100%
  max_consecutive_losses: 5        # Pause module after 5 genuine consecutive losses
  consecutive_loss_window_minutes: 20 # Window to detect clustered losses
  circuit_breaker_cooldown_minutes: 5 # Short 5-minute cooldown before re-enabling entries

system:
  poll_interval_seconds: 1
  heartbeat_interval_seconds: 60
  log_level: "INFO"
