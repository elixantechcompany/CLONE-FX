<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="50%" stop-color="#FFA751"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#06080C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(245, 200, 66, 0.4)" stroke-width="8"/>
  
  <!-- Inner Subtle Grid Lines -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="80" y1="160" x2="432" y2="160" stroke="rgba(255,255,255,0.04)" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="80" y1="352" x2="432" y2="352" stroke="rgba(255,255,255,0.04)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Candlestick 1 (Bullish Emerald) -->
  <line x1="150" y1="180" x2="150" y2="340" stroke="#10B981" stroke-width="4"/>
  <rect x="136" y="210" width="28" height="90" rx="4" fill="#10B981"/>

  <!-- Candlestick 2 (Bullish Gold Breakout) -->
  <line x1="256" y1="110" x2="256" y2="400" stroke="#F5C842" stroke-width="6" filter="url(#goldGlow)"/>
  <rect x="238" y="160" width="36" height="180" rx="6" fill="url(#goldGrad)" stroke="#FFE259" stroke-width="2" filter="url(#goldGlow)"/>

  <!-- Candlestick 3 (Expansion) -->
  <line x1="362" y1="90" x2="362" y2="310" stroke="#10B981" stroke-width="4"/>
  <rect x="348" y="120" width="28" height="120" rx="4" fill="#10B981"/>

  <!-- Lightning Arrow Overlay -->
  <path d="M 210 280 L 260 210 L 250 250 L 300 180" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
