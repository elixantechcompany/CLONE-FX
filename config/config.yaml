# ==============================================================================
# Precision Musumali Gold (XAUUSD) Trading Bot Configuration
# Micro-Account Edition ($10 - $25 Balance Shield)
# ==============================================================================

symbols:
  candidates:
    - "XAUUSDm"    # Exness Standard account suffix
    - "XAUUSD"
    - "XAUUSD_i"   # Exness Raw/Zero account suffix
    - "XAUUSDz"
    - "GOLD"

# ==============================================================================
# ENGINE 1: Musumali Liquidity Sweeps (M15, M30, H1, H4) [Magic: 2001]
# ==============================================================================
musumali_strategy:
  enabled: true
  signal_only_mode: false          # Live Order Execution enabled
  magic_number: 2001               # Fix 10: Unique Magic Number for Musumali_Sweep
  timeframes: ["M15", "M30", "H1", "H4"] # Multi-timeframe institutional sweep scanner
  cluster_search_bars: 15
  min_rejection_wick_pct: 0.15     # 15% wick rejection
  risk_reward_ratio: 2.0           # 1:2 Risk to Reward Target
  
  # Fix 21: ATR-Scaled Dynamic Stop Loss (1.5x ATR)
  atr_period: 14                   # 14-period ATR on execution timeframe
  atr_sl_multiplier: 1.5           # 1.5x ATR stop-loss distance
  min_sl_distance_dollars: 2.00    # Floor to prevent micro-spread compression
  max_sl_distance_dollars: 15.00   # Volatility ceiling

  # Higher-Timeframe Bias
  htf_timeframe: "H1"
  require_htf_alignment: false     # Allow sweeps on both swing highs (sell) and swing lows (buy)
  htf_fast_ema: 20
  htf_slow_ema: 50
  htf_trend_ema: 200

# ==============================================================================
# LIQUIDITY ZONE COOLDOWN
# ==============================================================================
zone_management:
  zone_band_points: 2.0
  max_zone_failures: 2
  zone_cooldown_minutes: 10

# ==============================================================================
# ENGINE 2: HIGH-CONVICTION MICRO-SCALPER (M5, M15) [Magic: 1001]
# ==============================================================================
m1_scalper:
  enabled: true
  bidirectional: true              # Agile Bidirectional: Capture both impulsive momentum breakouts and trend rides
  require_daily_trend_alignment: false # Decoupled from macro Daily gate
  trend_filter_enabled: false      # Allow rapid agile scalp entries in both directions
  trend_timeframe: "M15"           # Reference M15 trend context
  trend_ema_period: 20
  trend_slope_bars: 3
  magic_number: 1001               # Fix 10: Unique Magic Number for M1_Scalp
  timeframes: ["M1", "M5", "M15"]  # Active multi-timeframe micro-scalping (M1 momentum, M5 pullbacks, M15 waves)
  min_quality_score: 50            # Highly responsive Quality Score Threshold (0 - 100)
  max_concurrent_scalp: 1          # Micro-account: Max 1 active scalper position
  fast_ema: 7
  slow_ema: 16
  sweep_lookback_bars: 8
  
  # Reasonable ATR-Scaled Risk & Stop Loss
  atr_period: 14                   # 14-period ATR
  atr_sl_multiplier: 1.5           # 1.5x ATR stop-loss distance
  risk_reward_ratio: 2.0           # 1:2 R:R target
  min_sl_dollars: 2.00             # Reasonable stop loss floor (giving trade room to breathe)
  max_loss_dollars: 3.50           # Cap max loss to prevent high losses

# ==============================================================================
# INTELLIGENT POSITION MANAGEMENT & PROFIT RETENTION
# ==============================================================================
profit_management:
  enabled: true
  
  # Agile R-Multiple Dynamic Profit-Lock Stages (1R = Initial Stop Loss Risk)
  breakeven_trigger_r: 0.30          # Ultra-fast early breakeven lock at +0.30R
  breakeven_lock_r: 0.10             # Guaranteed green buffer (+0.10R)
  tier1_protect_trigger_r: 0.55      # At +0.55R -> Lock +0.30R
  tier1_protect_lock_r: 0.30
  tier2_protect_trigger_r: 0.85      # At +0.85R -> Lock +0.55R
  tier2_protect_lock_r: 0.55
  tier3_protect_trigger_r: 1.10      # At +1.10R -> Lock +0.80R & Continuous ATR Trailing
  tier3_protect_lock_r: 0.80
  
  # Multi-Signal Confirmed Reversal & Continuation Thresholds (0 - 100)
  reversal_exit_threshold: 70        # Reversal Score >= 70 -> Close position immediately
  reversal_warning_threshold: 50     # Reversal Score 50-69 -> Tighten trailing & giveback
  continuation_strong_threshold: 60  # Continuation Score >= 60 -> Let runners breathe
  
  # Dynamic Volatility-Aware Giveback & Peak R Decay (Early Profit Harvesting)
  giveback_min_peak_r: 0.50          # Start giveback protection once trade touches +0.50R peak
  giveback_max_r_decay: 0.25         # Bank profit if trade rolls back >0.25R from peak
  
  # Stale Trade Failure Timeout (Bars Held without progress)
  scalp_timeout_bars: 10             # Close stagnating M1 micro-scalps after 10 bars (10m)
  musumali_timeout_bars: 20          # Musumali HTF timeout (20 bars)
  
  # Direct Agile Dollar Accumulation Step Locking ($0.50 Accumulation Ratchet)
  dollar_step_lock_enabled: true
  dollar_step_size: 0.50             # Switch SL immediately on every accumulation of $0.50
  dollar_step_buffer: 0.20           # Guaranteed green profit buffer (+0.20 at $0.50 profit)
  
  # Dynamic Continuous Trailing Stop
  trailing_enabled: true
  trailing_trigger_r: 0.90           # Continuous ATR trailing begins early at +0.90R
  trailing_distance_dollars: 0.75    # Gold ATR trailing buffer ($0.75)

# ==============================================================================
# HARMONY & RISK ALLOCATION SPLIT (FIX 11 & FIX 12)
# ==============================================================================
harmony_rules:
  prevent_opposing_trades: true    # Fix 11: STRICTLY PREVENT HEDGING (Never BUY and SELL simultaneously)
  max_opposing_lot_exposure: 0.0   # Zero opposing lot exposure allowed
  total_max_open_positions: 2      # Strict concurrency (Max 2 total across account)
  max_musumali_positions: 1        # Max 1 Musumali trade
  max_scalper_positions: 1         # Max 1 Scalper trade
  cooldown_seconds_per_trade: 45   # 45-second cooldown after trade close to prevent rapid churning

risk_management:
  lot_mode: "auto_compound"        # "auto_compound" or "fixed"
  risk_per_trade_percent: 1.5      # Base 1.5% risk per trade
  max_total_account_risk_percent: 6.0 # Total portfolio shared risk ceiling
  fixed_lot_size: 0.01             # Base micro lot
  max_daily_trades: 50             # Active day trading capacity
  max_spread_points: 320           # Base max allowed spread
  slippage_points: 25              # Slippage tolerance in broker points
  
  # Auto-Compounding Equity Tiers
  compounding:
    enabled: true
    tiers:
      - min_equity: 0.0
        max_equity: 60.0
        lot_size: 0.01
      - min_equity: 60.0
        max_equity: 120.0
        lot_size: 0.02
      - min_equity: 120.0
        max_equity: 250.0
        lot_size: 0.03
      - min_equity: 250.0
        max_equity: 500.0
        lot_size: 0.05
      - min_equity: 500.0
        max_equity: 999999.0
        lot_size: 0.10

  # Session-Specific Strategy & Threshold Tuning
  session_tuning:
    enabled: true
    sessions:
      "London/NY Overlap":
        quality_score_threshold: 45
        max_spread_points: 340
        rsi_oversold: 25
        rsi_overbought: 75
      "London":
        quality_score_threshold: 50
        max_spread_points: 320
        rsi_oversold: 28
        rsi_overbought: 72
      "New York":
        quality_score_threshold: 50
        max_spread_points: 320
        rsi_oversold: 28
        rsi_overbought: 72
      "Asian":
        quality_score_threshold: 65
        max_spread_points: 280
        rsi_oversold: 32
        rsi_overbought: 68
      "Late Asian/Off-Hours":
        quality_score_threshold: 65
        max_spread_points: 300
        rsi_oversold: 30
        rsi_overbought: 70

  # High-Impact Macro News Filter
  news_blackout_enabled: false
  blackout_before_minutes: 0
  blackout_after_minutes: 0
  
  # Session Filter & Performance Tagging
  session_filter_enabled: true
  allowed_sessions: ["London", "London/NY Overlap", "New York", "Asian", "Late Asian/Off-Hours"]

# ==============================================================================
# PROFESSIONAL CIRCUIT BREAKERS & DRAWDOWN HIERARCHY
# ==============================================================================
circuit_breakers:
  # Continuous Trading Mode: Do not halt when market is profitable and clear
  continuous_trading_enabled: true
  max_daily_profit_percent: 0.0      # 0.0 = Uncapped (let profitable runs continue 24/7)
  
  # Institutional Daily Drawdown Ladder (Loss Protection)
  drawdown_warning_pct: 1.5          # Warning alert at 1.5% daily drawdown
  drawdown_risk_reduction_pct: 2.5   # Cut position size by 50% at 2.5% drawdown
  drawdown_pause_pct: 3.5            # 30-minute cooling pause at 3.5% drawdown
  max_daily_drawdown_percent: 5.0    # Hard halt for remainder of UTC day at 5% drawdown
  
  max_consecutive_losses: 3          # Module pause after 3 consecutive losses
  consecutive_loss_window_minutes: 20
  circuit_breaker_cooldown_minutes: 10
  
  # Emergency Catastrophic Backstop (Only fires on extreme slippage/gaps)
  hard_max_loss_per_trade_dollars: 5.00
  hard_max_loss_equity_pct: 15.0

notifications:
  telegram_enabled: false          # Set true if Telegram Bot alert is configured
  telegram_bot_token: ""           # e.g. 123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ
  telegram_chat_id: ""             # e.g. 987654321
  interactive_commands_enabled: true # Enable /status, /pnl, /pause, /resume, /closeall

dashboard:
  enabled: true
  export_interval_seconds: 5       # Auto-export JSON data for live HTML dashboard
  output_dir: "dashboard"

system:
  poll_interval_seconds: 1
  heartbeat_interval_seconds: 900  # Fix 32: Comprehensive self-reporting heartbeat every 15 mins (900s)
  quick_heartbeat_interval_seconds: 60 # Quick 1-minute pulse
  log_level: "INFO"
